name: Build checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The four build checks (they ask the live APIs)
        run: npm run check
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
